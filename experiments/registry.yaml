    script: scripts/replicate_attnsleep_edf20.py --folds 0-19 --epochs 100 --seed 123
    data: legacy Sleep-EDF-20 Fpz-Cz NPZ (SC 00-19; no lockbox person), unscored epochs dropped, 42,308 epochs
    protocol: 20-fold leave-one-subject-out, per-epoch AttnSleep, published recipe (Adam amsgrad, lr 1e-3 -> 1e-4 at epoch 10, wd 1e-3, batch 128, 100 epochs, class weights mu=[1.5,2,1.5,1,1.5] from training subjects, D-002)
