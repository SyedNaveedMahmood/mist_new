    best_test_epoch_OPTIMISTIC: {acc: 0.8378, mf1: 0.7853, kappa: 0.7791, f1: [0.890, 0.459, 0.883, 0.897, 0.796]}
    status: VERIFIED
    note: 'Published Table V reproduced under the published repo''s selection (epoch with best TEST accuracy per fold): MF1 78.5 vs 78.1, acc 83.8 vs 84.4. Without test selection (final epoch) MF1 is 75.0, 3.1 points below. The difference is the effect of choosing the epoch on the test fold (D-001). Weakest folds: subject 11 (final acc 0.618), 08 (0.646). 368 s/fold, run concurrently with E0 training. A check of our AttnSleep code and recipe only; not a project result.'
