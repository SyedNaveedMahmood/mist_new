[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mist"
version = "0.1.0"
description = "MIST-GRM: gain / rhythm / morphology factorised tokens for transferable single-channel sleep staging"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch>=2.1", "pyyaml", "scikit-learn", "pandas"]

[project.optional-dependencies]
data = ["mne>=1.6", "xlrd>=2.0"]
dev = ["pytest", "edfio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
